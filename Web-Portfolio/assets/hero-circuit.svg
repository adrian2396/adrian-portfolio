<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 70 760 590" fill="none" role="img" aria-labelledby="circuit-title circuit-description">
  <title id="circuit-title">Arquitectura de sistemas conectados</title>
  <desc id="circuit-description">Ilustración conceptual de un circuito en perspectiva con un procesador AV, pistas de cobre y módulos conectados.</desc>
